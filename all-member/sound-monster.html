<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Sound Monster Run｜聲控怪獸跑酷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>👾</text></svg>" />
<!-- ============================================================
  Sound Monster Run — 60 秒聲控橫向跑酷
  Renderer: Phaser 3.80 (WebGL/Canvas auto)  ‧  Audio: Web Audio API
  單頁封裝：全部 CSS / 遊戲邏輯內嵌，僅 Phaser 由固定版本 CDN 載入。
  程式分區：CONFIG ‧ AUDIO(VoiceInput) ‧ INPUT ‧ SFX ‧ LEADERBOARD ‧
            PHASER GameScene(game state/render/score) ‧ APP(UI/flow/fallback)
============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  :root{
    --bg1:#ffd6ec; --bg2:#c8b6ff; --bg3:#bbecff;
    --candy:#ff6fb5; --grape:#7b5cff; --mint:#37e1b5; --sun:#ffd23f;
    --ink:#3a2a5d; --card:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:"Segoe UI Rounded","Microsoft JhengHei",-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #app{position:fixed;inset:0;}
  #game-holder{position:absolute;inset:0;}
  #game-holder canvas{display:block;margin:auto;}

  /* ---------- DOM 畫面（靜態 UI，避免遊戲主畫面大量 DOM 動畫） ---------- */
  .screen{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    padding:24px;text-align:center;z-index:20;
  }
  .hidden{display:none !important;}
  .logo{
    font-size:clamp(34px,7vw,64px);font-weight:900;line-height:1.05;
    letter-spacing:1px;
    background:linear-gradient(90deg,#ff5fa2,#7b5cff,#37c9ff,#ffb13f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 0 rgba(255,255,255,.5);
    filter:drop-shadow(0 6px 10px rgba(123,92,255,.35));
  }
  .logo .mon{font-size:1.1em;-webkit-text-fill-color:initial;}
  .subtitle{font-size:clamp(15px,2.6vw,20px);font-weight:700;opacity:.85;margin-top:-6px;}
  .card{
    background:rgba(255,255,255,.82);backdrop-filter:blur(6px);
    border-radius:26px;padding:18px 22px;box-shadow:0 12px 30px rgba(123,92,255,.25);
    max-width:min(620px,94vw);
  }
  .how{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;font-size:clamp(13px,2.2vw,16px);font-weight:700;}
  .how span{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .how b{color:var(--grape);}
  .btnrow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
  button.big{
    border:none;cursor:pointer;font-family:inherit;font-weight:900;color:#fff;
    font-size:clamp(17px,3vw,22px);padding:16px 26px;border-radius:20px;
    box-shadow:0 8px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.18);
    transition:transform .08s,box-shadow .08s;
  }
  button.big:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .b-voice{background:linear-gradient(180deg,#ff8ac4,#ff4f9e);}
  .b-touch{background:linear-gradient(180deg,#7fd2ff,#4aa9ff);}
  .b-grape{background:linear-gradient(180deg,#9d83ff,#7b5cff);}
  .b-mint{background:linear-gradient(180deg,#5ef0c4,#19c79b);}
  .b-ghost{background:linear-gradient(180deg,#c9c2e8,#a99fd6);}
  .hint{font-size:13px;opacity:.7;font-weight:700;}

  /* 校準 */
  #screen-calibrate .meter-wrap{width:min(420px,82vw);}
  .bigmsg{font-size:clamp(22px,4.5vw,34px);font-weight:900;}
  .meter{height:26px;border-radius:14px;background:#ffffffcc;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.15);position:relative;}
  .meter .fill{height:100%;width:0%;border-radius:14px;background:linear-gradient(90deg,#37e1b5,#ffd23f,#ff5fa2);transition:width .05s linear;}
  .countbig{font-size:clamp(60px,16vw,140px);font-weight:900;color:#fff;text-shadow:0 6px 0 rgba(123,92,255,.5);}

  /* 結算 */
  #screen-result .panel{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .score-big{font-size:clamp(46px,10vw,84px);font-weight:900;color:var(--grape);line-height:1;}
  .title-badge{font-size:clamp(18px,3.4vw,26px);font-weight:900;color:#fff;background:linear-gradient(90deg,#ff5fa2,#7b5cff);padding:8px 18px;border-radius:999px;box-shadow:0 6px 14px rgba(123,92,255,.35);}
  .stat-row{display:flex;gap:18px;font-weight:800;font-size:clamp(14px,2.6vw,18px);}
  .stat-row div b{display:block;font-size:1.5em;color:var(--candy);}
  .name-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .name-row input{
    font-family:inherit;font-weight:800;font-size:18px;padding:10px 14px;border-radius:14px;
    border:3px solid #d9cffb;width:160px;text-align:center;color:var(--ink);outline:none;
  }
  .name-row input:focus{border-color:var(--grape);}
  .lb{width:min(460px,90vw);text-align:left;}
  .lb h3{margin:6px 0;text-align:center;font-size:18px;}
  .lb ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .lb li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.07);}
  .lb li .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none;background:#bbb;}
  .lb li:nth-child(1) .rk{background:linear-gradient(180deg,#ffd23f,#ff9e2f);}
  .lb li:nth-child(2) .rk{background:linear-gradient(180deg,#cfd6e6,#9fb0c9);}
  .lb li:nth-child(3) .rk{background:linear-gradient(180deg,#f0b78a,#cf8f5c);}
  .lb li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb li .sc{color:var(--grape);}
  .lb li .tt{font-size:11px;opacity:.7;font-weight:700;}
  .lb .empty{text-align:center;opacity:.6;font-weight:700;padding:14px;}

  /* 橫向提示 */
  #orient{
    position:absolute;inset:0;z-index:60;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(160deg,#7b5cff,#37c9ff);color:#fff;font-weight:900;
  }
  #orient .rot{font-size:80px;animation:rot 1.6s ease-in-out infinite;}
  @keyframes rot{0%,100%{transform:rotate(-12deg);}50%{transform:rotate(78deg);}}

  /* 暫停選單：疊在遊戲畫面上方（半透明，畫面仍可見） */
  #screen-pause{z-index:45;background:rgba(40,22,66,.5);backdrop-filter:blur(3px);}
  #screen-pause .bigmsg{color:#fff;text-shadow:0 3px 0 rgba(123,92,255,.6);}

  /* 右上角控制（遊玩中） */
  #topbtns{position:absolute;top:10px;right:10px;z-index:30;display:none;gap:8px;}
  #topbtns button{border:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.8);font-size:22px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15);}

  /* ---- Kenney UI Pack 按鈕皮膚（CC0，9-slice border-image） ---- */
  button.big{
    background:transparent !important; box-shadow:none !important;
    border-style:solid; border-color:transparent;
    border-width:22px 22px 30px 22px;
    border-image-slice:22 22 30 22 fill;
    border-image-width:22px 22px 30px 22px;
    border-image-repeat:stretch;
    padding:0 10px; min-height:64px; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.28);
  }
  button.big:active{transform:translateY(4px);}
  .big.b-voice{border-image-source:url(assets/sound-monster/ui/btn_red.png);}
  .big.b-touch{border-image-source:url(assets/sound-monster/ui/btn_blue.png);}
  .big.b-grape{border-image-source:url(assets/sound-monster/ui/btn_yellow.png);color:#6a5212;text-shadow:0 1px 0 rgba(255,255,255,.4);}
  .big.b-mint{border-image-source:url(assets/sound-monster/ui/btn_green.png);}
  .big.b-ghost{border-image-source:url(assets/sound-monster/ui/btn_blue.png);}

  .float{animation:fl 3s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .pop{animation:pop .5s cubic-bezier(.18,1.4,.4,1);}
  @keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
</style>
</head>
<body>
<div id="app">
  <div id="game-holder"></div>

  <!-- 遊玩中右上：靜音 / 暫停 -->
  <div id="topbtns">
    <button id="btn-mute" title="音效">🔊</button>
    <button id="btn-pause" title="暫停">⏸</button>
  </div>

  <!-- 暫停選單（疊在遊戲畫面上，畫面仍可見） -->
  <div id="screen-pause" class="screen hidden">
    <div class="bigmsg">⏸ 暫停中</div>
    <div class="btnrow">
      <button class="big b-mint" id="btn-resume">▶ 繼續</button>
      <button class="big b-grape" id="btn-restart">🔁 重新開始</button>
      <button class="big b-ghost" id="btn-pause-home">🏠 回首頁</button>
    </div>
  </div>

  <!-- 主選單 -->
  <div id="screen-menu" class="screen">
    <div class="logo pop"><span class="mon">👾</span> Sound Monster Run</div>
    <div class="subtitle">用你的聲音，帶怪獸狂奔 60 秒！</div>
    <div class="card float">
      <div class="how">
        <span>👏 <b>出聲</b> 就跳</span>
        <span>🎐 <b>持續出聲</b> 浮更高</span>
        <span>📣 <b>大聲一吼</b> 衝刺撞牆</span>
      </div>
      <div class="how" style="margin-top:10px;">
        <span>🍬 糖果 +分</span><span>⭐ 星星 大分</span><span>🌈 彩虹圈 連擊倍數</span>
        <span>🟪 軟糖牆 衝刺撞破</span><span>🌵 仙人掌糖 跳過</span>
      </div>
    </div>
    <div class="btnrow">
      <button class="big b-voice" id="btn-start-voice">🎤 用聲音玩</button>
      <button class="big b-touch" id="btn-start-touch">👆 用觸控玩</button>
    </div>
    <div class="hint">桌機也可用鍵盤：空白鍵=跳　按住=浮高　X/↑=衝刺</div>
    <button class="big b-ghost" id="btn-menu-lb" style="font-size:16px;padding:10px 18px;">🏆 排行榜</button>
  </div>

  <!-- 校準 -->
  <div id="screen-calibrate" class="screen hidden">
    <div class="bigmsg" id="cal-msg">先安靜 3 秒，讓怪獸聽聽周圍的聲音…</div>
    <div class="countbig" id="cal-count">3</div>
    <div class="card meter-wrap">
      <div style="font-weight:800;margin-bottom:8px;">🔊 目前音量</div>
      <div class="meter"><div class="fill" id="cal-fill"></div></div>
      <div class="hint" style="margin-top:8px;">校準後可以小聲「哈！」測試一下～</div>
    </div>
  </div>

  <!-- 結算 -->
  <div id="screen-result" class="screen hidden">
    <div class="panel card">
      <div class="bigmsg">🎉 衝過終點派對門！</div>
      <div class="title-badge" id="res-title">糖果新手</div>
      <div class="score-big" id="res-score">0</div>
      <div class="stat-row">
        <div>最高連擊<b id="res-combo">0</b></div>
        <div>糖果<b id="res-candy">0</b></div>
        <div>星星<b id="res-star">0</b></div>
      </div>
      <div class="name-row">
        <input id="res-name" maxlength="8" placeholder="你的暱稱" />
        <button class="big b-mint" id="btn-save" style="font-size:16px;padding:12px 18px;">儲存成績</button>
      </div>
    </div>
    <div class="lb card" id="res-lb"></div>
    <div class="btnrow">
      <button class="big b-grape" id="btn-replay">🔁 再玩一次</button>
      <button class="big b-ghost" id="btn-home" style="background:linear-gradient(180deg,#c9c2e8,#a99fd6);">🏠 回首頁</button>
    </div>
  </div>

  <!-- 純排行榜檢視 -->
  <div id="screen-lb" class="screen hidden">
    <div class="logo" style="font-size:clamp(28px,6vw,48px);">🏆 本機排行榜</div>
    <div class="lb card" id="view-lb"></div>
    <div class="btnrow">
      <button class="big b-ghost" id="btn-clear-lb">🧹 清除排行榜</button>
      <button class="big b-grape" id="btn-lb-back">← 返回</button>
    </div>
  </div>

  <!-- 直向提示 -->
  <div id="orient"><div class="rot">📱</div><div>把裝置轉成「橫向」更好玩喔！</div></div>
</div>

<script>
"use strict";
/* =====================================================================
   區塊 1 — CONFIG（裝置偵測 + 降階策略 + 數值）
   ===================================================================== */
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0;

const GAME_W = 1280, GAME_H = 720;       // 內部渲染解析度（高解析、FIT 縮放，iPad 視網膜也清晰）

// 動態畫質：預設一律「華麗」(tier 2)，只有在實測掉幀時才由看門狗降階。
// 不預先因為是行動裝置就閹割畫面 —— 先漂亮，撐不住才退讓。
const Quality = {
  tier: 2,                                 // 2=華麗(預設) 1=中 0=省電
  _downgraded: false,                      // 是否曾被看門狗降階（跨局保留，讓 FPS 回穩後能升回）
  qty(){ return [0.5,0.78,1][this.tier]; },         // 粒子量係數
  maxObjects(){ return [18,24,30][this.tier]; },    // 同時存在物件上限
  useAdd(){ return this.tier >= 1; },               // ADD 加亮輝光
  blend(){ return this.useAdd() ? Phaser.BlendModes.ADD : Phaser.BlendModes.NORMAL; }
};

const GAME_TIME = 60;                    // 固定 60 秒
const GROUND_Y = 630, PLAYER_X = 260;    // （依 1280×720 設計）
const GRAVITY = 2000, JUMP_V = -860, GLIDE_GRAV = 480, GLIDE_MAXFALL = 105;
const SPEED0 = 440, SPEED1 = 580;        // 世界捲動速度（隨時間加快）
const DASH_MULT = 1.85, DASH_TIME = 620, DASH_CD = 900; // 衝刺（CD>TIME → 兩次衝刺間有空檔，不能一直無敵）
const BONK_TIME = 520, IFRAME_TIME = 1000; // 撞牆失控(無法操作) / 受傷無敵閃爍(穿透障礙)

// 聲音判定參數（相對校準後的正規化音量 0..1）— 中度簡化：跳/浮 + 大聲衝刺，無暈眩
const VOICE = {
  loudRef: 0.32, floorMargin: 0.012,
  attack: 0.6, release: 0.10, baseSmooth: 0.04,   // 非對稱包絡(快攻擊/慢釋放) + 慢基線
  onsetMargin: 0.12, jumpMin: 0.26, jumpCD: 250,  // onset：包絡越過(base+margin)的上升緣即跳
  floatLo: 0.25, glideHold: 120,                  // 持續出聲＝浮空（合併原滑翔，校準後的絕對門檻）
  dashMargin: 0.45, dashCD: 820,                  // 大聲一吼＝衝刺；相對 base → 吵雜派對/跨局自適應
  sampleMs: 8                                       // 解耦取樣間隔（脫離 render 迴圈）
};

const LS = {                              // localStorage：一律 soundMonster:* 前綴
  board: 'soundMonster:leaderboard',
  name:  'soundMonster:lastName',
  muted: 'soundMonster:muted'
};

/* =====================================================================
   區塊 1.5 — DEBUG：延遲儀表（?debug=1 顯示 FPS / 取樣間隔 / 輸入→動作延遲）
   ===================================================================== */
const Debug = {
  on: /[?&]debug/.test(location.search),
  jumpLat: 0, sampleMs: 0, el: null,
  init(){
    if(!this.on) return;
    const d = document.createElement('div'); d.id='dbg';
    d.style.cssText='position:fixed;left:8px;bottom:8px;z-index:80;background:rgba(0,0,0,.62);color:#7CFC00;'
      +'font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:6px 9px;border-radius:7px;white-space:pre;pointer-events:none;';
    document.body.appendChild(d); this.el=d;
  },
  update(fps){
    if(!this.on || !this.el) return;
    this.el.textContent =
      `FPS        ${fps}\n取樣間隔   ${this.sampleMs.toFixed(1)} ms\n輸入→跳    ${this.jumpLat.toFixed(0)} ms\n模式       ${Input.mode}`;
  }
};

/* =====================================================================
   區塊 2 — AUDIO：VoiceInput（Web Audio API，非語音辨識）
   兩段校準 → 解耦取樣 → 非對稱包絡 onset(跳) / 持續(浮) / 大聲(衝刺) + cooldown
   ===================================================================== */
const VoiceInput = {
  ready:false, active:false, ctx:null, stream:null, analyser:null, buf:null,
  floor:0.02, loudRef:VOICE.loudRef,
  env:0, base:0, level:0,
  glideTimer:0, lastJump:-9999, lastDash:-9999, _wasAbove:false,
  samplerId:null, _lastT:0, _avgDt:VOICE.sampleMs,
  // 已偵測、尚未被遊戲消費的鎖存事件（latched edges）
  pJump:false, pDash:false, glideOn:false, jumpAt:0,

  clearEdges(){ this.pJump=this.pDash=false; this.glideOn=false; },
  resetRound(){ this.glideTimer=0; this.env=0; this.base=0; this._wasAbove=false; this.lastJump=-9999; this.lastDash=-9999; this.clearEdges(); },

  async init(){
    this.ctx = new (window.AudioContext||window.webkitAudioContext)({ latencyHint:'interactive' });
    if(this.ctx.state === 'suspended') await this.ctx.resume();
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
    const src = this.ctx.createMediaStreamSource(this.stream);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 1024;
    this.analyser.smoothingTimeConstant = 0;   // 時域 RMS 不受此影響，設 0 避免誤導
    src.connect(this.analyser);
    this.buf = new Uint8Array(this.analyser.fftSize);
    this.ready = true;
    this.startSampler();
  },
  rms(){
    if(!this.ready) return 0;
    this.analyser.getByteTimeDomainData(this.buf);
    let s=0; const b=this.buf, n=b.length;
    for(let i=0;i<n;i++){ const v=(b[i]-128)/128; s+=v*v; }
    return Math.sqrt(s/n);
  },
  norm(r){ return Math.max(0, Math.min(1, (r - this.floor) / Math.max(0.05, this.loudRef - this.floor))); },

  // 解耦取樣器：~8ms 在 render 迴圈之外更新包絡並鎖存事件（不被掉幀拖累取樣粒度）
  startSampler(){ if(this.samplerId) return; this._lastT=performance.now(); this.samplerId=setInterval(()=>this.tick(), VOICE.sampleMs); },
  stopSampler(){ if(this.samplerId){ clearInterval(this.samplerId); this.samplerId=null; } },
  tick(){
    const nowT=performance.now(); const dt=Math.min(50, nowT-this._lastT); this._lastT=nowT;
    this._avgDt += (dt-this._avgDt)*0.1; Debug.sampleMs=this._avgDt;
    if(!this.active || !this.ready) return;              // 閘門：非遊玩 / 暫停時不偵測
    const r=this.rms(), n=this.norm(r);
    // 非對稱包絡（快攻擊、慢釋放）+ 慢基線
    this.env  += (n - this.env)  * (n > this.env ? VOICE.attack : VOICE.release);
    this.base += (n - this.base) * VOICE.baseSmooth;
    this.level = this.env;
    // R1 噪音自適應：衝刺門檻相對 base（吵雜派對自適應），但封頂 0.85 確保「用力大吼」永遠衝得了
    const dashTh = Math.min(0.85, this.base + VOICE.dashMargin);
    if(this.env > dashTh && nowT-this.lastDash > VOICE.dashCD){ this.pDash=true; this.lastDash=nowT; }
    // onset 跳躍：包絡越過 (base+margin) 的「上升緣」→ 前緣即觸發、不靠絕對音量
    const above = this.env > this.base+VOICE.onsetMargin && this.env > VOICE.jumpMin;
    if(above && !this._wasAbove && !this.pDash && nowT-this.lastJump > VOICE.jumpCD){
      this.pJump=true; this.jumpAt=nowT; this.lastJump=nowT;
    }
    this._wasAbove = above;
    // 持續出聲＝浮空（合併原滑翔：跳起後繼續出聲就浮高）
    if(n > VOICE.floatLo) this.glideTimer+=dt; else this.glideTimer=0;
    this.glideOn = this.glideTimer > VOICE.glideHold;
  },
  // 遊戲每幀消費：回傳鎖存事件並清除上升緣
  read(){
    const e={ jump:this.pJump, dash:this.pDash, glide:this.glideOn, level:this.level, jumpAt:this.jumpAt };
    this.pJump=this.pDash=false;
    return e;
  },

  // 量測一段時間的平均/峰值（給校準用）
  measure(ms, onTick){
    const start=performance.now(); let acc=0,cnt=0,peak=0;
    return new Promise(res=>{
      const step=()=>{
        const t=performance.now()-start; const r=this.rms(); acc+=r; cnt++; if(r>peak) peak=r;
        if(onTick) onTick(Math.min(1,t/ms), this.norm(r));
        if(t<ms) requestAnimationFrame(step); else res({ avg:acc/Math.max(1,cnt), peak });
      };
      requestAnimationFrame(step);
    });
  },
  // 兩段式校準：① 底噪 → floor；② 大聲一喊 → 自適應 loudRef（含保底，安靜麥也玩得動）
  async calibrate(onTick){
    const m1 = await this.measure(3000, (p,lv)=>onTick('floor',p,lv));
    this.floor = Math.min(0.2, m1.avg + VOICE.floorMargin);
    const m2 = await this.measure(2500, (p,lv)=>onTick('loud',p,lv));
    const span = Math.max(0.12, Math.min(0.5, m2.peak*0.55 - this.floor));   // 保底 span：喊太小聲也不會卡死
    this.loudRef = this.floor + span;
  }
};

/* =====================================================================
   區塊 3 — INPUT：統一輸入（voice / touch+keyboard 共用介面）
   ===================================================================== */
const Input = {
  mode:'touch',                 // 'voice' | 'touch'
  _jumpQ:false, _dashQ:false, _glide:false, _pulse:0, jumpAt:0,
  queueJump(){ this._jumpQ = true; this._pulse = 1; this.jumpAt = performance.now(); },
  queueDash(){ this._dashQ = true; this._pulse = 1; },
  setGlide(v){ this._glide = v; },
  reset(){ this._jumpQ=false; this._dashQ=false; this._glide=false; this._pulse=0; },  // 清掉上一局殘留（避免開局幻影跳/滑）
  // 統一契約：voice 走解耦取樣鎖存的事件；touch 走自己的佇列
  poll(dt, now){
    if(this.mode === 'voice') return VoiceInput.read();
    const j=this._jumpQ, d=this._dashQ; this._jumpQ=false; this._dashQ=false;
    this._pulse = Math.max(0, this._pulse - dt/300);
    const lv = this._glide ? 0.42 : (d?0.85:this._pulse*0.7);
    return { jump:j, dash:d, glide:this._glide, level:lv, jumpAt:this.jumpAt };
  }
};

/* =====================================================================
   區塊 4 — SFX：Kenney Interface Sounds（CC0 .ogg）+ 程序合成備援
   檔案載入失敗時自動回退到 Web Audio 合成音，確保永不無聲/報錯。
   ===================================================================== */
const Sfx = {
  ctx:null, master:null, muted:false, active:0, buffers:{}, loaded:false,
  MAP:{ click:'click_001', jump:'select_005', collect:'pluck_001', star:'glass_006',
        ring:'confirmation_001', bonk:'error_004', dash:'glitch_002', finish:'confirmation_004' },
  ensure(){
    if(this.ctx) return;
    this.ctx = VoiceInput.ctx || new (window.AudioContext||window.webkitAudioContext)({ latencyHint:'interactive' });
    this.master = this.ctx.createGain();
    this.muted = localStorage.getItem(LS.muted) === '1';
    this.master.gain.value = this.muted ? 0 : 0.6;
    this.master.connect(this.ctx.destination);
  },
  load(){
    this.ensure(); if(this.loaded) return; this.loaded = true;
    Object.entries(this.MAP).forEach(([k,f])=>{
      fetch('assets/sound-monster/sfx/'+f+'.ogg')
        .then(r=> r.ok ? r.arrayBuffer() : Promise.reject())
        .then(b=> this.ctx.decodeAudioData(b))
        .then(buf=>{ this.buffers[k]=buf; })
        .catch(()=>{}); // 失敗 → 用合成備援，不報錯
    });
  },
  toggle(){ this.ensure(); this.muted=!this.muted; this.master.gain.value=this.muted?0:0.6; localStorage.setItem(LS.muted, this.muted?'1':'0'); return this.muted; },
  play(name, vol){
    this.ensure(); if(this.muted || this.active > 8) return;   // 限制同時音效重疊
    if(this.ctx.state==='suspended') this.ctx.resume();
    const buf = this.buffers[name];
    if(buf){
      const s=this.ctx.createBufferSource(); s.buffer=buf;
      const g=this.ctx.createGain(); g.gain.value=vol||0.6;
      s.connect(g); g.connect(this.master);
      this.active++; s.start(); s.onended=()=>{ this.active--; };
    } else { this.syn(name); }
  },
  tone(freq, dur, type, vol, slideTo){
    this.ensure(); if(this.muted || this.active > 8) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.3,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master);
    this.active++; o.start(t); o.stop(t+dur+0.02); o.onended=()=>{ this.active--; };
  },
  syn(name){ // 程序合成備援
    switch(name){
      case 'jump': this.tone(440,0.16,'sine',0.25,820); break;
      case 'collect': this.tone(880,0.12,'triangle',0.22,1320); break;
      case 'star': this.tone(660,0.1,'triangle',0.25,990); break;
      case 'ring': this.tone(523,0.12,'square',0.18,1046); break;
      case 'dash': this.tone(180,0.26,'sawtooth',0.22,1200); break;
      case 'bonk': this.tone(160,0.3,'sawtooth',0.3,70); break;
      case 'finish': [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'triangle',0.3),i*110)); break;
      default: this.tone(700,0.1,'sine',0.2);
    }
  },
  click(){ this.play('click',0.5); },
  jump(){ this.play('jump',0.5); },
  collect(){ this.play('collect',0.5); },
  star(){ this.play('star',0.6); },
  ring(){ this.play('ring',0.6); },
  dash(){ this.play('dash',0.5); },
  bonk(){ this.play('bonk',0.6); },
  smash(){ this.play('bonk',0.5); },
  finish(){ this.play('finish',0.7); setTimeout(()=>this.play('star',0.5),140); setTimeout(()=>this.play('ring',0.5),300); }
};

/* =====================================================================
   區塊 5 — LEADERBOARD：本機 Top 5（localStorage，soundMonster:*）
   欄位：暱稱、分數、最高 Combo、稱號、日期
   ===================================================================== */
const Board = {
  read(){ try{ const a = JSON.parse(localStorage.getItem(LS.board)||'[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } },
  write(a){ try{ localStorage.setItem(LS.board, JSON.stringify(a.slice(0,5))); }catch(e){} },  // 隱私模式/配額爆掉不致命
  add(entry){
    const a = this.read(); a.push(entry);
    a.sort((x,y)=>y.score - x.score);
    this.write(a);
    return a.slice(0,5).findIndex(e=>e===entry);  // 名次（-1 表示未進榜）
  },
  clear(){ localStorage.removeItem(LS.board); },
  render(el, highlightName, highlightScore){
    const a = this.read();
    if(!a.length){ el.innerHTML = '<div class="empty">還沒有人挑戰過～快來當第一名！</div>'; return; }
    el.innerHTML = '<ol>' + a.map((e,i)=>{
      const hot = (e.name===highlightName && e.score===highlightScore) ? 'style="outline:3px solid #ff5fa2;"' : '';
      return `<li ${hot}><span class="rk">${i+1}</span>
        <span class="nm">${escapeHtml(e.name)} <span class="tt">${escapeHtml(e.title||'')}・x${escapeHtml(String(e.combo))} ・${escapeHtml(String(e.date||''))}</span></span>
        <span class="sc">${escapeHtml(String(e.score))}</span></li>`;
    }).join('') + '</ol>';
  }
};
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function titleFor(score, combo){
  if(score>=4000) return '怪獸吼吼王 👑';
  if(score>=2600) return '彩虹收藏家 🌈';
  if(score>=1700) return '衝刺達人 💨';
  if(score>=1000) return '滑翔小子 🪂';
  if(score>=450)  return '跳跳學徒 ⭐';
  return combo>=12 ? '連擊小可愛 ✨' : '糖果新手 🍬';
}

/* =====================================================================
   區塊 6 — PHASER GameScene（game state + render + score）
   ===================================================================== */
class GameScene extends Phaser.Scene {
  constructor(){ super('game'); }

  /* ---- 程序貼圖：僅用於粒子 / 輝光（角色與物件皆為 Kenney 圖檔） ---- */
  makeCircle(key, r, color){
    if(this.textures.exists(key)) return;
    const g = this.make.graphics({x:0,y:0,add:false});
    g.fillStyle(color,1); g.fillCircle(r,r,r);
    g.generateTexture(key, r*2, r*2); g.destroy();
  }
  // 柔邊輝光（多層同心圓近似 radial gradient）
  makeGlow(key, r){
    if(this.textures.exists(key)) return;
    const g = this.make.graphics({x:0,y:0,add:false});
    for(let i=12;i>=1;i--){ g.fillStyle(0xffffff, 0.06); g.fillCircle(r,r, r*i/12); }
    g.generateTexture(key, r*2, r*2); g.destroy();
  }
  /* ---- 載入 Kenney CC0 圖檔（角色 / 糖果世界 / 收集物 / 障礙） ---- */
  preload(){
    const C='assets/sound-monster/';
    ['stand','walk1','walk2','jump','hurt','duck'].forEach(f=>this.load.image('mon_'+f, C+'char/alienPink_'+f+'.png'));
    this.load.image('ground', C+'world/cakeMid.png');
    this.load.image('hill',   C+'world/hillCanePink.png');
    this.load.image('cloudA', C+'world/cloud1.png');
    this.load.image('cloudB', C+'world/cloud2.png');
    ['candyRed','candyBlue','candyGreen','candyYellow','star','gemYellow','cactus','flagBlue']
      .forEach(n=>this.load.image(n, C+'items/'+n+'.png'));
    this.load.image('slimeBlock', C+'items/slimeBlock.png');
  }

  create(data){
    const W=GAME_W, H=GAME_H;
    this.cameras.main.setBackgroundColor('#bfe9ff');

    // 程序貼圖（粒子 / 輝光）
    this.makeCircle('spark', 10, 0xffffff);
    this.makeGlow('glow', 64);

    // 角色跑步動畫（walk1/walk2 交替）
    if(!this.anims.exists('run')){
      this.anims.create({ key:'run', frames:[{key:'mon_walk1'},{key:'mon_walk2'}], frameRate:12, repeat:-1 });
    }

    this.buildBackground(W,H);

    // 糖果蛋糕地面：捲動 tileSprite（看起來會跑）+ 隱形靜態碰撞體
    const gh = H - GROUND_Y;
    this.groundTile = this.add.tileSprite(W/2, GROUND_Y + gh/2, W, gh, 'ground').setDepth(2);
    this.ground = this.add.rectangle(W/2, GROUND_Y+44, W, 80, 0x000000, 0);
    this.physics.add.existing(this.ground, true); // static body

    // 玩家（Kenney 粉紅外星怪獸，CC0）
    this.player = this.physics.add.sprite(PLAYER_X, GROUND_Y-40, 'mon_stand').setDepth(10);
    this.player.setCollideWorldBounds(false);
    this.player.body.setSize(46,80);          // 在原圖 66×92 內置中
    this.player.setGravityY(GRAVITY);
    this._expr = null;
    this.physics.add.collider(this.player, this.ground, ()=>{
      this.airJumps = 2;
      if(this.running && this.time.now - this.jumpBuffer < 130){ this.jumpBuffer = 0; this.doJump(); }  // 落地補跳
    });

    // 物件群組
    this.objects = this.physics.add.group({ allowGravity:false });
    this.physics.add.overlap(this.player, this.objects, this.onHit, null, this);

    // 粒子發射器（重複使用，手動 explode）
    this.fx = this.add.particles(0,0,'spark',{ lifespan:560, speed:{min:90,max:260}, scale:{start:1.0,end:0}, rotate:{min:0,max:360}, blendMode:Quality.blend(), emitting:false });
    this.fx.setDepth(9);
    this.dashTrail = this.add.particles(0,0,'glow',{ lifespan:320, speed:24, scale:{start:0.9,end:0}, tint:0xfff1a8, blendMode:Quality.blend(), emitting:false });
    this.dashTrail.setDepth(8);
    // 玩家輝光光暈（衝刺時顯現）
    this.aura = this.add.image(PLAYER_X, 0, 'glow').setDepth(9).setBlendMode(Quality.blend()).setAlpha(0).setScale(2.2);

    // 漂浮文字回饋池（重複使用 12 個 Text，避免每顆糖果都 new/destroy 造成 GC 抖動）
    this.popPool = []; this.popIdx = 0;
    for(let i=0;i<12;i++){
      this.popPool.push(this.add.text(0,0,'',{fontFamily:'"Segoe UI Rounded",sans-serif',fontSize:'26px',fontStyle:'900',color:'#fff'})
        .setOrigin(0.5).setDepth(20).setStroke('#3a2a5d',4).setVisible(false));
    }

    // 狀態
    this.resetState();

    // 鍵盤（桌機 / 測試）
    this.keys = this.input.keyboard.addKeys({ jump:'SPACE', glide:'SHIFT', dash:'X', up:'UP' });
    this.keys.jump.on('down', ()=>{ if(Input.mode==='touch' && !App.paused) Input.queueJump(); });
    this.keys.dash.on('down', ()=>{ if(Input.mode==='touch' && !App.paused) Input.queueDash(); });
    this.keys.up.on('down',   ()=>{ if(Input.mode==='touch' && !App.paused) Input.queueDash(); });
    this.keys.glide.on('down',()=>{ if(Input.mode==='touch' && !App.paused) Input.setGlide(true); });   // 按住=浮高
    this.keys.glide.on('up',  ()=>{ if(Input.mode==='touch') Input.setGlide(false); });

    // 觸控：點擊=跳、按住=滑翔、右下 DASH 區
    this.setupTouch(W,H);

    // HUD
    this.buildHUD(W,H);

    this.time.delayedCall(300, ()=>{
      this.running = true;
      if(Input.mode==='voice' && VoiceInput.ready){ VoiceInput.active = true; VoiceInput.clearEdges(); }  // 開跑才開始偵測
    });
  }

  resetState(){
    this.running=false; this.finishing=false; this.finished=false;
    this.score=0; this.combo=0; this.maxCombo=0; this.mult=1;
    this.candyCount=0; this.starCount=0;
    this.timeLeft=GAME_TIME; this.traveled=0; this.nextSpawn=420;
    this.worldSpeed=SPEED0; this.airJumps=2;
    this.dashUntil=0; this.lastDashAt=-9999; this.bonkUntil=0; this.hurtUntil=0; this.jumpBuffer=0; this.exprFlashUntil=0;
    this.invincible=false; this.spawnIdx=0; this.elapsed=0;
    this._fpsLow=0; this._fpsHigh=0;
    // HUD/meter 重畫快取（buildHUD 每局重建 graphics，故須一併重置，否則第二局起背景不畫）
    this._meterInit=false; this._meterKey=-1; this._lastSc=-1; this._lastTs=-1; this._lastCombo=-1; this._lastMult=-1;
  }

  buildBackground(W,H){
    // 漸層天空
    const sky=this.add.graphics().setDepth(0);
    sky.fillGradientStyle(0xffd9f2, 0xffd9f2, 0xbfe9ff, 0xd9f7ff, 1);
    sky.fillRect(0,0,W,H);

    // 太陽 + 輝光
    this.add.image(W-150,130,'glow').setScale(4.2).setTint(0xffe27a).setAlpha(0.8).setBlendMode(Quality.blend()).setDepth(0);
    this.add.circle(W-150,130,60,0xfff0a0).setDepth(0);

    // 閃爍星星（少量，twinkle tween）
    for(let i=0;i<10;i++){
      const s=this.add.star(Phaser.Math.Between(40,W-40), Phaser.Math.Between(30,260), 4, 2, 7, 0xffffff, 0.9).setDepth(0);
      this.tweens.add({targets:s, alpha:0.15, scale:0.5, duration:Phaser.Math.Between(900,1800), yoyo:true, repeat:-1, delay:i*120});
    }

    // 遠山糖果丘（兩層視差）
    const far=this.add.graphics().setDepth(0);
    far.fillStyle(0xd7c4ff,0.7); far.fillEllipse(280,640,720,420); far.fillEllipse(950,660,820,460);
    const g=this.add.graphics().setDepth(1);
    g.fillStyle(0xffc6e6,0.95); g.fillEllipse(220,690,560,360);
    g.fillStyle(0xc9b6ff,0.9);  g.fillEllipse(760,720,720,420);
    g.fillStyle(0xa9e6ff,0.85);  g.fillEllipse(1180,700,620,380);

    // 糖果拐杖山丘（Kenney Candy expansion）擺在地平線上當裝飾
    [180,560,940,1240].forEach((hx)=> this.add.image(hx, GROUND_Y+8, 'hill').setOrigin(0.5,1).setScale(1.5).setDepth(1));

    // 雲（Kenney，緩慢視差）
    this.clouds=[];
    for(let i=0;i<5;i++){
      const c=this.add.image(120+i*260, 90+(i%2)*60, i%2?'cloudB':'cloudA').setScale(1.0+(i%3)*0.25).setAlpha(0.95).setDepth(1);
      this.clouds.push(c);
    }
  }

  buildHUD(W,H){
    const st={fontFamily:'"Segoe UI Rounded","Microsoft JhengHei",sans-serif',fontStyle:'900'};
    this.hudTime = this.add.text(W/2, 26, '60', {...st, fontSize:'44px', color:'#ffffff'}).setOrigin(0.5).setDepth(40)
      .setStroke('#7b5cff',7);
    this.hudScore = this.add.text(W-22, 18, '0', {...st, fontSize:'30px', color:'#7b5cff'}).setOrigin(1,0).setDepth(40).setStroke('#fff',5);
    this.hudCombo = this.add.text(W-22, 56, '', {...st, fontSize:'22px', color:'#ff5fa2'}).setOrigin(1,0).setDepth(40).setStroke('#fff',4);

    // 左側音量表（畫在 canvas，不用 DOM）
    this.meterBg = this.add.graphics().setDepth(40);
    this.meterFill = this.add.graphics().setDepth(41);
    this.meterLabel = this.add.text(28, 92, Input.mode==='voice'?'🎤 音量':'👆 觸控', {...st, fontSize:'16px', color:'#3a2a5d'}).setDepth(41);

    // 觸控提示
    if(Input.mode==='touch'){
      this.add.text(W/2, H-26, '👆 點一下=跳　按住=浮高　右下角=衝刺', {...st, fontSize:'18px', color:'#3a2a5d'}).setOrigin(0.5).setDepth(40);
      this.dashBtn = this.add.circle(W-72, H-72, 50, 0xff5fa2, 0.85).setDepth(40).setStrokeStyle(5,0xffffff);
      this.add.text(W-72, H-72, '衝!', {...st, fontSize:'26px', color:'#fff'}).setOrigin(0.5).setDepth(41);
    }
  }

  setupTouch(W,H){
    let held=false, onDash=false;
    this.input.on('pointerdown', (p)=>{
      if(Input.mode!=='touch' || !this.running || App.paused) return;
      // 右下角 DASH 圓鈕
      if(this.dashBtn && Phaser.Math.Distance.Between(p.x,p.y,this.dashBtn.x,this.dashBtn.y) < 64){
        onDash=true; Input.queueDash(); return;
      }
      Input.queueJump();                 // 按下即跳（不再等放開 → 觸控延遲降到 1 幀）
      held=false;
      this._holdTimer = this.time.delayedCall(130, ()=>{ held=true; Input.setGlide(true); });  // 續壓→滑翔
    });
    this.input.on('pointerup', ()=>{
      if(Input.mode!=='touch') return;
      if(onDash){ onDash=false; return; }
      if(this._holdTimer) this._holdTimer.remove();
      Input.setGlide(false); held=false;
    });
  }

  /* ---------- 物件生成（樣式：用樣板而非個別亂數，確保公平好玩） ---------- */
  spawn(type, x, y){
    if(this.objects.countActive(true) >= Quality.maxObjects()) return null;
    let tex;
    if(type==='candy'){ const pal=['candyRed','candyBlue','candyGreen','candyYellow']; tex=pal[(this._candyN=(this._candyN||0)+1)%4]; }
    else tex = {star:'star',ring:'gemYellow',jelly:'slimeBlock',cactus:'cactus',gate:'flagBlue'}[type];
    const o = this.objects.create(x, y, tex);
    o.objType = type; o.hit=false; o.setDepth(6);
    if(type==='jelly'){        // 軟糖牆：拉長的 Kenney slime 方塊
      o.setOrigin(0.5,0.5).setScale(1.35,3.0); o.y = GROUND_Y + 6 - o.displayHeight/2;
      o.body.reset(o.x, o.y);  // 縮放後必須 reset，body 才會對齊整面牆（否則停在建立時的 y≈0 → 不會碰撞）
    } else if(type==='gate'){  // 終點派對旗
      o.setOrigin(0.5,0.5).setScale(2.0); o.y = GROUND_Y + 6 - o.displayHeight/2;
      o.body.reset(o.x, o.y);
    } else if(type==='cactus'){
      o.setOrigin(0.5,1); o.y=GROUND_Y+6; o.body.setSize(46,60);
    } else if(type==='ring'){  o.body.setCircle(28,7,7); o.floatY=y; o.spin=true; }
      else if(type==='star'){  o.body.setCircle(28,7,7); o.floatY=y; o.spin=true; }
      else {                   o.body.setCircle(26,9,9); o.floatY=y; }   // candy
    o.body.setAllowGravity(false);
    return o;
  }
  patterns(x){
    const G=GROUND_Y, p=this.spawnIdx++;
    const arc=(cx,cy,n,sp)=>{ for(let i=0;i<n;i++){ this.spawn('candy', cx+i*sp, cy - Math.sin(i/(n-1)*Math.PI)*120); } };
    const list=[
      ()=>arc(x,G-90,5,70),                                            // 糖果彩虹弧（跳）
      ()=>{ for(let i=0;i<4;i++) this.spawn('candy',x+i*64,G-70); },     // 地面糖果排
      ()=>{ this.spawn('star',x,G-220); this.spawn('candy',x-50,G-150); this.spawn('candy',x+50,G-150); }, // 高星星
      ()=>{ this.spawn('cactus',x); for(let i=0;i<3;i++) this.spawn('candy',x+120+i*60,G-110); }, // 仙人掌+糖果
      ()=>{ this.spawn('star',x,G-250); for(let i=0;i<3;i++) this.spawn('candy',x+(i-1)*70,G-130); },  // 高星星(持續出聲浮上去)
      ()=>{ this.spawn('ring',x,G-160); for(let i=0;i<4;i++) this.spawn('candy',x+70+i*55,G-160); }, // 彩虹圈連擊
      ()=>{ this.spawn('jelly',x); this.spawn('ring',x-130,G-150); for(let i=0;i<3;i++) this.spawn('star',x+90+i*60,G-150);}, // 軟糖牆(衝)後星星
      ()=>{ this.spawn('cactus',x); for(let i=0;i<3;i++) this.spawn('candy',x+110+i*55,G-150); this.spawn('cactus',x+300); }, // 雙仙人掌間糖果
    ];
    // 前 3 個樣式用簡單的，之後隨機
    const idx = p<3 ? p%3 : (p*7+3)%list.length;
    list[idx]();
  }

  popFloat(x,y,txt,color){
    const t = this.popPool[this.popIdx]; this.popIdx = (this.popIdx+1) % this.popPool.length;
    this.tweens.killTweensOf(t);
    t.setText(txt).setColor(color||'#fff').setPosition(x,y).setAlpha(1).setScale(1).setVisible(true);
    this.tweens.add({targets:t, y:y-50, alpha:0, duration:700, onComplete:()=>t.setVisible(false)});
  }
  burst(x,y,tint,n){
    this.fx.setParticleTint(tint);
    this.fx.explode(Math.max(3, Math.round((n||10)*Quality.qty())), x, y);
  }

  // 用 Kenney 角色幀組合表情：跑步動畫 + 跳/滑/衝/受傷 各一幀，輔以傾斜與染色
  setExpr(s){
    if(this._expr===s) return; this._expr=s;
    const p=this.player; p.clearTint(); p.setAngle(0);
    if(s==='run'){ p.play('run', true); return; }
    p.anims.stop();
    if(s==='happy'||s==='win'){ p.setTexture('mon_jump'); }
    else if(s==='glide'){ p.setTexture('mon_jump'); p.setAngle(-10); p.setTint(0xbfe3ff); }
    else if(s==='dash'){ p.setTexture('mon_jump'); p.setAngle(12); p.setTint(0xfff2a0); }
    else if(s==='dizzy'){ p.setTexture('mon_hurt'); p.setTint(0xff8a8a); }   // 受傷：紅染表情
    else { p.setTexture('mon_stand'); }
  }
  // 微回饋：身體 Q 彈一下（body 為絕對尺寸 setSize → 縮放不影響碰撞，安全）
  monsterPop(s){ this.tweens.killTweensOf(this.player); this.player.setScale(1); this.tweens.add({ targets:this.player, scaleX:s, scaleY:s, duration:70, yoyo:true, onComplete:()=>this.player.setScale(1) }); }

  /* ---------- 碰撞 ---------- */
  onHit(player, o){
    if(o.hit || !o.active) return;
    const now=this.time.now;
    // 受傷無敵閃爍期間：穿透障礙，不再連續受擊
    if(now < this.hurtUntil && (o.objType==='cactus'||o.objType==='jelly')) return;
    switch(o.objType){
      case 'candy':
        o.hit=true; this.addScore(10); this.combo++; this.candyCount++;
        this.burst(o.x,o.y,0xff8ac4,8); Sfx.collect(); this.popFloat(o.x,o.y,'+'+(10*this.mult),'#ffd23f');
        this.monsterPop(1.12); this.exprFlashUntil=now+200;   // 吃到→小開心彈
        o.destroy(); break;
      case 'star':
        o.hit=true; this.addScore(50); this.combo+=2; this.starCount++;
        this.burst(o.x,o.y,0xffe27a,16); Sfx.star(); this.popFloat(o.x,o.y,'⭐+'+(50*this.mult),'#fff');
        this.monsterPop(1.24); this.exprFlashUntil=now+280;   // 星星→大開心彈
        o.destroy(); break;
      case 'ring':
        o.hit=true; this.mult=Math.min(5,this.mult+1); this.addScore(20); this.combo++;
        this.burst(o.x,o.y,0xff5fa2,18); Sfx.ring(); this.popFloat(o.x,o.y,'倍數 x'+this.mult,'#ff5fa2');
        this.monsterPop(1.18); this.exprFlashUntil=now+240;
        o.destroy(); break;
      case 'jelly':
        o.hit=true;
        if(this.invincible){ this.addScore(30); this.combo++; this.burst(o.x,o.y-60,0xd6a6ff,18); Sfx.smash(); this.popFloat(o.x,o.y-80,'撞破!+'+(30*this.mult),'#fff'); o.destroy(); }
        else { this.doBonk(o); }
        break;
      case 'cactus':
        o.hit=true;
        if(this.invincible){ this.addScore(15); this.burst(o.x,o.y-30,0x8be08f,12); Sfx.smash(); this.popFloat(o.x,o.y-50,'踏扁!','#fff'); o.destroy(); }
        else { this.doSpike(o); }
        break;
      case 'gate':
        if(!this.finished) this.triggerFinish();
        break;
    }
  }
  doHurt(o, vx, vy, txt, color){
    this.combo=0; this.mult=1;
    this.bonkUntil=this.time.now+BONK_TIME;       // 短暫無法操作
    this.hurtUntil=this.time.now+IFRAME_TIME;     // 較長的無敵閃爍（穿透障礙）
    this.player.setVelocity(vx, vy);              // 收斂彈跳（不彈過高）
    this.burst(o.x,o.y-40,color,12); Sfx.bonk();
    this.popFloat(this.player.x,this.player.y-60,txt,'#ff5fa2');
    this.setExpr('dizzy');
    this.cameras.main.shake(150, 0.006);
    o.destroy();
  }
  doBonk(o){ this.doHurt(o, -80, -240, 'QQ 撞牆了…', 0xb06bff); }   // 軟糖牆未衝刺
  doSpike(o){ this.doHurt(o, 0, -280, '哎呀！', 0xff8a3b); }         // 仙人掌
  addScore(base){ this.score += base * this.mult; }

  // FPS 看門狗：實測掉幀才降階（先漂亮，撐不住才退讓）
  watchdog(dt){
    const fps = this.game.loop.actualFps;
    if(!fps || !isFinite(fps)) return;
    if(fps < 45){ this._fpsLow += dt; this._fpsHigh = 0; }
    else if(fps > 57){ this._fpsHigh += dt; this._fpsLow = Math.max(0, this._fpsLow - dt); }
    else { this._fpsLow = Math.max(0, this._fpsLow - dt*0.5); }
    if(this._fpsLow > 1600 && Quality.tier > 0){ this.setTier(Quality.tier-1); this._fpsLow=0; Quality._downgraded=true; }
    else if(this._fpsHigh > 9000 && Quality._downgraded && Quality.tier < 2){ this.setTier(Quality.tier+1); this._fpsHigh=0; }  // 跨局保留，FPS 回穩可升回
  }
  setTier(t){
    t = Phaser.Math.Clamp(t,0,2);
    if(t === Quality.tier) return;
    Quality.tier = t;
    const bm = Quality.blend();
    this.fx.blendMode = bm; this.dashTrail.blendMode = bm; this.aura.blendMode = bm;
    if(t < 2) this.popFloat(GAME_W/2, 140, '⚙️ 自動調整畫質保持流暢', '#7b5cff');
  }

  triggerFinish(){
    this.finished=true; this.running=false;
    Sfx.finish(); this.setExpr('win');
    // 派對門演出：彩帶
    for(let i=0;i<3;i++) this.time.delayedCall(i*180, ()=>{
      [0xff5fa2,0xffd23f,0x37e1b5,0x7b5cff].forEach(c=>this.burst(Phaser.Math.Between(300,GAME_W-100), Phaser.Math.Between(120,260), c, 14));
    });
    this.tweens.add({targets:this.player, y:this.player.y-60, yoyo:true, repeat:3, duration:240});
    this.time.delayedCall(1800, ()=> App.toResult({
      score:Math.round(this.score), combo:this.maxCombo, candy:this.candyCount, star:this.starCount
    }));
  }

  /* ---------- 主迴圈（Phaser 內建 game loop） ---------- */
  update(time, delta){
    const dt = Math.min(48, delta);
    // 視差雲
    for(const c of this.clouds){ c.x -= 0.15*dt*(c.scale*0.4); if(c.x < -90) c.x = GAME_W+90; }

    if(!this.running && !this.finishing){ this.drawMeter(0); return; }

    // 輸入
    const ev = Input.poll(dt, time);
    this.drawMeter(ev.level||0);
    const bonked = time < this.bonkUntil;

    if(this.running){
      // 計時
      this.elapsed += dt; this.timeLeft = Math.max(0, GAME_TIME - this.elapsed/1000);
      const ts = Math.ceil(this.timeLeft);
      if(ts !== this._lastTs){ this.hudTime.setText(ts); this._lastTs = ts; }
      if(this.timeLeft <= 8) this.hudTime.setColor(this.timeLeft%1<0.5?'#ff3b6b':'#ffffff');
      this.worldSpeed = Phaser.Math.Linear(SPEED0, SPEED1, this.elapsed/(GAME_TIME*1000));

      // 觸發終點
      if(this.timeLeft <= 0 && !this.finishing){
        this.finishing=true;
        const gate=this.spawn('gate', GAME_W+120, 0);
        this.time.delayedCall(4000, ()=>{ if(!this.finished) this.triggerFinish(); });
      }
    }

    // 處理事件（撞牆失控時忽略主動操作）
    if(!bonked && this.running){
      if(ev.dash && time - this.lastDashAt > DASH_CD){ this.startDash(time); }  // 真正的冷卻，避免連續無敵
      if(ev.jump){
        if(this.airJumps > 0){ this._jumpAt = ev.jumpAt; this.doJump(); }
        else { this.jumpBuffer = time; this._jumpAt = ev.jumpAt; }              // 緩衝：落地瞬間補跳
      }
      this.gliding = !!ev.glide;
    } else { this.gliding=false; }

    // 衝刺狀態 + 光暈
    this.invincible = time < this.dashUntil;
    const curSpeed = this.worldSpeed * (this.invincible ? DASH_MULT : 1);
    this.groundTile.tilePositionX += curSpeed * dt/1000;   // 地面捲動（跑起來的感覺）
    if(this.invincible){
      if(Math.random()<0.6) this.dashTrail.explode(1, this.player.x-22, this.player.y+10);
      this.aura.setAlpha(0.7).setScale(2.2+Math.sin(time*0.02)*0.35); this.aura.y=this.player.y;
    } else if(this.aura.alpha>0){ this.aura.setAlpha(Math.max(0,this.aura.alpha-0.08)); this.aura.y=this.player.y; }

    // 滑翔物理：整段滑翔都用低重力（不再依 vy 正負每幀切換 → 不抖動，且上升段也吃得到滑翔），落速封頂
    const vy = this.player.body.velocity.y;
    this.player.setGravityY(this.gliding ? GLIDE_GRAV : GRAVITY);
    if(this.gliding && vy > GLIDE_MAXFALL) this.player.setVelocityY(GLIDE_MAXFALL);

    // 表情優先序：受傷 > 衝刺 > 吃到開心閃 > 浮空 > 地面跑/空中跳
    if(time < this.hurtUntil) this.setExpr('dizzy');
    else if(this.invincible) this.setExpr('dash');
    else if(time < this.exprFlashUntil) this.setExpr('happy');
    else if(this.gliding) this.setExpr('glide');
    else this.setExpr(this.player.body.blocked.down ? 'run' : 'happy');
    // 受傷無敵閃爍（alpha 與 setExpr 無衝突）
    this.player.setAlpha(time < this.hurtUntil ? (Math.floor(time/70)%2 ? 0.35 : 1) : 1);

    // 移動所有物件（用 physics velocity 維持 overlap 偵測）
    const v=-curSpeed;
    this.objects.children.iterate(o=>{
      if(!o) return;
      o.body.velocity.x = v;
      // 浮空物上下飄動 + 旋轉
      if(o.floatY!=null){ o.y = o.floatY + Math.sin((time+o.x)*0.004)*10; }
      if(o.spin) o.rotation += 0.045;
      if(o.x < -160) o.destroy();
    });

    this.watchdog(dt);

    // 生成
    this.traveled += curSpeed * dt/1000;
    if(!this.finishing && this.traveled >= this.nextSpawn){
      this.patterns(GAME_W + 80);
      const gap = Phaser.Math.Linear(330, 250, this.elapsed/(GAME_TIME*1000));
      this.nextSpawn = this.traveled + gap;
    }

    // 防止掉出畫面下方
    if(this.player.y > GROUND_Y-20) this.airJumps = 2;
    if(this.player.y > GAME_H+80){ this.player.setPosition(PLAYER_X, GROUND_Y-120); this.player.setVelocity(0,0); }

    // combo / HUD（只在數值變動時才 setText，避免每幀重繪 canvas 文字）
    if(this.combo > this.maxCombo) this.maxCombo=this.combo;
    const sc = Math.round(this.score);
    if(sc !== this._lastSc){ this.hudScore.setText(sc); this._lastSc = sc; }
    if(this.combo !== this._lastCombo || this.mult !== this._lastMult){
      this.hudCombo.setText(this.combo>=2 ? `連擊 ${this.combo}　倍數 x${this.mult}` : '');
      this._lastCombo = this.combo; this._lastMult = this.mult;
    }

    // 維持玩家固定 x
    this.player.x = PLAYER_X;

    if(Debug.on) Debug.update(Math.round(this.game.loop.actualFps));
  }

  doJump(){
    if(Debug.on && this._jumpAt){ Debug.jumpLat = performance.now() - this._jumpAt; this._jumpAt = 0; }  // 輸入→動作延遲
    this.airJumps--;
    this.player.setVelocityY(this.airJumps===1 ? JUMP_V : JUMP_V*0.86);
    this.burst(this.player.x, this.player.y+24, 0xffffff, 5);            // 起跳塵粒
    this.tweens.killTweensOf(this.player); this.player.setScale(1);      // 起跳 squash（拉長）
    this.tweens.add({ targets:this.player, scaleX:0.86, scaleY:1.18, duration:110, yoyo:true, onComplete:()=>this.player.setScale(1) });
    Sfx.jump(); this.setExpr('happy');
  }
  startDash(time){
    this.dashUntil = time + DASH_TIME; this.lastDashAt = time;
    this.burst(this.player.x, this.player.y, 0xffd23f, 14);
    Sfx.dash(); this.setExpr('dash');
    this.cameras.main.flash(120, 255,255,200);
  }

  drawMeter(level){
    const x=24, y=120, w=22, h=300;
    if(!this._meterInit){
      this.meterBg.fillStyle(0xffffff,0.75); this.meterBg.fillRoundedRect(x-4,y-4,w+8,h+8,12);
      this._meterInit=true;
    }
    const fh = Phaser.Math.Clamp(level,0,1)*h;
    const dashLine = Math.min(0.85, VoiceInput.base + VOICE.dashMargin);   // 衝刺門檻隨環境噪音浮動(封頂 0.85)
    let col=0x37e1b5;                                          // 安靜=綠
    if(level>dashLine) col=0xff8a3b; else if(level>VOICE.floatLo) col=0x37c9ff;  // 大聲=橘(衝刺) / 出聲=藍(跳·浮)
    const key = (fh|0)*1000 + (col & 0xff) + (dashLine*97|0)*7;   // 量化：填色高度(px)+色帶+衝刺線位置；不變就不重畫
    if(key === this._meterKey) return;
    this._meterKey = key;
    const g=this.meterFill; g.clear();
    g.fillStyle(0xeeeeee,0.6); g.fillRoundedRect(x,y,w,h,10);              // 區帶底色
    g.fillStyle(col,1); g.fillRoundedRect(x, y+h-fh, w, fh, 10);          // 當前音量
    g.lineStyle(2,0xff5fa2,0.8);                                          // 門檻線
    [dashLine, VOICE.floatLo].forEach(t=>{ const yy=y+h-t*h; g.beginPath(); g.moveTo(x-3,yy); g.lineTo(x+w+3,yy); g.strokePath(); });
  }
}

/* =====================================================================
   區塊 7 — APP：UI 流程 / 模式選擇 / Fallback / Phaser 生命週期
   ===================================================================== */
const App = {
  game:null, scene:null, paused:false,
  el(id){ return document.getElementById(id); },
  show(id){
    ['screen-menu','screen-calibrate','screen-result','screen-lb'].forEach(s=>this.el(s).classList.add('hidden'));
    this.el('screen-pause').classList.add('hidden');   // 暫停選單永遠不殘留在其他畫面
    if(id) this.el(id).classList.remove('hidden');
    this.el('topbtns').style.display = (id===null) ? 'flex' : 'none';
    // 只有遊玩中(id===null)才顯示遊戲畫布；用 visibility（非 display:none）以保留尺寸，
    // 否則 Phaser FIT 會量到 0×0 把畫布縮成 0。
    this.el('game-holder').style.visibility = (id===null) ? 'visible' : 'hidden';
  },

  init(){
    Sfx.ensure(); Sfx.load(); Debug.init();
    this.el('btn-mute').textContent = Sfx.muted?'🔇':'🔊';
    document.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>Sfx.click()));

    this.el('btn-start-voice').onclick = ()=>this.startVoice();
    this.el('btn-start-touch').onclick = ()=>this.startGame('touch');
    this.el('btn-menu-lb').onclick = ()=>{ Board.render(this.el('view-lb')); this.show('screen-lb'); };
    this.el('btn-lb-back').onclick = ()=>this.show('screen-menu');
    this.el('btn-clear-lb').onclick = ()=>{ if(confirm('確定要清除本機排行榜嗎？')){ Board.clear(); Board.render(this.el('view-lb')); } };
    this.el('btn-replay').onclick = ()=>this.startGame(Input.mode);
    this.el('btn-home').onclick = ()=>{ this.stopGame(); this.show('screen-menu'); };
    this.el('btn-save').onclick = ()=>this.saveScore();
    this.el('btn-mute').onclick = ()=>{ const m=Sfx.toggle(); this.el('btn-mute').textContent=m?'🔇':'🔊'; };

    // 暫停系統
    this.el('btn-pause').onclick = ()=>this.togglePause();
    this.el('btn-resume').onclick = ()=>this.resumeGame();
    this.el('btn-restart').onclick = ()=>this.restartFromPause();
    this.el('btn-pause-home').onclick = ()=>this.pauseHome();
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden) this.pauseGame(); });  // 切背景自動暫停
    window.addEventListener('keydown', (e)=>{ if(e.key==='Escape'||e.key==='p'||e.key==='P') this.togglePause(); });

    this.el('res-name').value = localStorage.getItem(LS.name) || '';
    this.checkOrient();
    window.addEventListener('resize', ()=>this.checkOrient());
    window.addEventListener('orientationchange', ()=>setTimeout(()=>this.checkOrient(),300));
    this.show('screen-menu');
  },

  // ---- 暫停 / 繼續 / 重新開始 / 回首頁 ----
  isPlaying(){ const sc=this.game && this.game.scene.getScene('game'); return !!(sc && (sc.scene.isActive()||sc.scene.isPaused())); },
  pauseGame(){
    if(this.paused || !this.isPlaying()) return;
    const sc=this.game.scene.getScene('game');
    if(!sc.scene.isActive()) return;          // 只有真正在跑時可暫停
    this.paused=true;
    VoiceInput.active=false;                   // B4：音訊閘門，暫停中喊叫不觸發
    sc.scene.pause();
    this.el('btn-pause').textContent='▶';
    this.el('screen-pause').classList.remove('hidden');
  },
  resumeGame(){
    if(!this.paused) return;
    this.paused=false;
    this.el('screen-pause').classList.add('hidden');
    this.el('btn-pause').textContent='⏸';
    const sc=this.game.scene.getScene('game');
    Input.reset(); if(VoiceInput.ready) VoiceInput.resetRound();   // 清掉暫停期間殘留
    if(sc) sc.scene.resume();
    if(Input.mode==='voice' && VoiceInput.ready) VoiceInput.active=true;
  },
  togglePause(){ if(!this.isPlaying()) return; this.paused ? this.resumeGame() : this.pauseGame(); },
  restartFromPause(){
    this.paused=false; this.el('screen-pause').classList.add('hidden'); this.el('btn-pause').textContent='⏸';
    this.startGame(Input.mode);
  },
  pauseHome(){
    this.paused=false; this.el('screen-pause').classList.add('hidden'); this.el('btn-pause').textContent='⏸';
    this.stopGame(); this.show('screen-menu');
  },

  checkOrient(){
    const portrait = window.innerHeight > window.innerWidth;
    this.el('orient').style.display = (IS_TOUCH && portrait) ? 'flex' : 'none';
  },

  // 嘗試麥克風 → 成功則校準；失敗則 fallback 觸控
  async startVoice(){
    try{ Sfx.ensure(); if(VoiceInput.ctx && VoiceInput.ctx.state==='suspended') await VoiceInput.ctx.resume(); }catch(e){}
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      this.fallback('這個瀏覽器不支援麥克風，改用觸控玩！'); return;
    }
    try{
      // 加上逾時：使用者若「略過」權限提示（既非允許也非拒絕），不會卡死，15 秒後自動轉觸控
      if(!VoiceInput.ready) await Promise.race([
        VoiceInput.init(),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('mic-timeout')), 15000))
      ]);
      Input.mode='voice';
      await this.calibrate();
      this.startGame('voice');
    }catch(err){
      console.warn('mic unavailable:', err && err.name);
      this.fallback('沒拿到麥克風，改用觸控玩一樣好玩！');
    }
  },
  fallback(msg){
    Input.mode='touch';
    // 不卡死：直接進觸控模式
    if(msg) this.el('cal-msg') && (this.el('cal-msg').textContent = msg);
    this.startGame('touch');
  },

  calibrate(){
    this.show('screen-calibrate');
    const msg=this.el('cal-msg'), cnt=this.el('cal-count'), fill=this.el('cal-fill');
    return VoiceInput.calibrate((phase, prog, lv)=>{
      fill.style.width = Math.round(lv*100)+'%';
      if(phase==='floor'){
        msg.textContent='先安靜 3 秒，讓怪獸聽聽周圍的聲音…';
        cnt.textContent = Math.max(1, Math.ceil(3 - prog*3));
      } else {
        msg.textContent='換你大喊一聲！讓怪獸記住你的音量 📣';
        cnt.textContent = Math.max(1, Math.ceil(2.5 - prog*2.5));
      }
    }).then(()=>{
      msg.textContent='校準完成！準備出發～';
      cnt.textContent='GO!';
      return new Promise(r=>setTimeout(r,600));
    });
  },

  ensureGame(){
    if(this.game) return;
    this.game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game-holder',
      width: GAME_W, height: GAME_H,
      backgroundColor:'#bfe9ff',
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
      physics: { default:'arcade', arcade:{ gravity:{y:0} } },
      render: { antialias: true, powerPreference:'high-performance', roundPixels: false },
      fps: { target:60, min:30 },
      scene: [GameScene]
    });
  },

  startGame(mode){
    Input.mode = mode;
    Input.reset();                 // 清掉上一局殘留輸入
    this.paused = false;
    VoiceInput.active = false;      // 開跑前不偵測（由場景 running 後才開啟）
    if(VoiceInput.ready) VoiceInput.resetRound();
    Sfx.ensure();
    this.ensureGame();
    this.show(null); // 隱藏所有 DOM 畫面，顯示遊戲 + 右上鈕
    const boot=()=>{
      if(this.game.scale) this.game.scale.refresh();   // 重新量測尺寸，避免 0×0
      this.scene = this.game.scene.getScene('game');
      const sm = this.scene && this.scene.scene;
      if(sm && (sm.isActive() || sm.isPaused())) sm.restart();   // 含「從暫停中重開」
      else this.game.scene.start('game');
    };
    // 等 Phaser 準備好
    if(this.game.isBooted) boot(); else this.game.events.once('ready', boot);
  },

  stopGame(){
    this.paused = false; VoiceInput.active = false;
    if(this.game && this.game.scene.getScene('game')){
      try{ this.game.scene.stop('game'); }catch(e){}
    }
  },

  toResult(data){
    this.last = data;
    this.paused = false; VoiceInput.active = false;   // 結算後停止偵測
    this.el('btn-pause').textContent = '⏸';
    this.show('screen-result');
    this.el('res-score').textContent = data.score;
    this.el('res-combo').textContent = data.combo;
    this.el('res-candy').textContent = data.candy;
    this.el('res-star').textContent  = data.star;
    const title = titleFor(data.score, data.combo);
    this.el('res-title').textContent = title;
    this._title = title;
    this._saved = false;
    this.el('btn-save').disabled=false; this.el('btn-save').textContent='儲存成績';
    this.el('res-name').value = localStorage.getItem(LS.name) || '';
    Board.render(this.el('res-lb'));
    try{ this.game.scene.stop('game'); }catch(e){}
  },

  saveScore(){
    if(this._saved) return;
    let name = (this.el('res-name').value||'').trim().slice(0,8) || '小怪獸';
    try{ localStorage.setItem(LS.name, name); }catch(e){}
    const d = new Date();
    const entry = {
      name, score:this.last.score, combo:this.last.combo,
      title:this._title.replace(/\s*[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}👑]/gu,'').trim(),
      date:`${d.getMonth()+1}/${d.getDate()}`
    };
    Board.add(entry);
    this._saved=true;
    this.el('btn-save').disabled=true; this.el('btn-save').textContent='已儲存 ✓';
    Board.render(this.el('res-lb'), name, this.last.score);
  }
};

window.addEventListener('load', ()=>App.init());
</script>
</body>
</html>
